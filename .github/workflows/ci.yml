name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: bandaid:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: docker run --rm bandaid:test pytest

  build:
    name: Build & boot check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: bandaid:runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot check
        run: |
          docker run -d --name bandaid -p 8000:8000 bandaid:runtime
          trap 'docker rm -f bandaid >/dev/null 2>&1' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo "health endpoint OK"
              exit 0
            fi
            sleep 1
          done
          echo "health endpoint did not come up" >&2
          docker logs bandaid
          exit 1
