name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: test
          load: true
          tags: bandaid:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Lint (ruff check)
        run: docker run --rm bandaid:test ruff check source tests

      - name: Format check (ruff format)
        run: docker run --rm bandaid:test ruff format --check source tests

      - name: Type check (mypy)
        run: docker run --rm bandaid:test mypy source

  test:
    name: Test (Docker)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: test
          load: true
          tags: bandaid:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: docker run --rm bandaid:test pytest

  build:
    name: Build & boot check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          load: true
          tags: bandaid:runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot check
        run: |
          docker run -d --name bandaid -p 8000:8000 bandaid:runtime
          trap 'docker rm -f bandaid >/dev/null 2>&1' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo "health endpoint OK"
              exit 0
            fi
            sleep 1
          done
          echo "health endpoint did not come up" >&2
          docker logs bandaid
          exit 1
