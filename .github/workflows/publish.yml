name: Publish

# Reusable workflow: called directly by `.github/workflows/release.yml` via
# `workflow_call`. Kept separate so the release workflow reuses (not duplicates)
# the test/build/push/release steps. Permissions are inherited from the caller.
on:
  workflow_call:
    inputs:
      version:
        description: "Version number (e.g. 7)"
        required: true
        type: string

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: test
          load: true
          tags: llm-gauze:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Lint (ruff check)
        run: docker run --rm llm-gauze:test ruff check source tests

      - name: Format check (ruff format)
        run: docker run --rm llm-gauze:test ruff format --check source tests

      - name: Type check (mypy)
        run: docker run --rm llm-gauze:test mypy source

  test:
    name: Test (Docker)
    runs-on: ubuntu-24.04
    needs: [lint]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: test
          load: true
          tags: llm-gauze:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: docker run --rm llm-gauze:test pytest

  publish:
    name: Publish image + release
    runs-on: ubuntu-24.04
    needs: [test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute lowercase image name
        id: image
        run: echo "name=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:${{ inputs.version }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # GHCR package visibility is independent of repository visibility and
      # defaults to private. This repository is public, so make the pushed
      # image public too. The owner is a personal account, hence the `/user/`
      # endpoint (an org repo would use `/orgs/<owner>/...`).
      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            "/user/packages/container/${GITHUB_REPOSITORY##*/}/visibility" \
            -f visibility=public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ inputs.version }}" --generate-notes
