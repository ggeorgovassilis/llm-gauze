# Local development: build from source and live-mount ./source for fast
# iteration. This is the "develop" compose file, used by ./scripts/dev.sh and
# ./scripts/test.sh. Public users should use docker-compose.yml (published
# image) instead.

services:
  gateway:
    build:
      context: .
      target: runtime
    # Run as the host user (UID/GID, default 1000) so files written to the
    # bind-mounted volumes (data/, and __pycache__ under source/) are owned by
    # the developer, not root, and can be deleted/rotated without sudo.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${PORT:-9317}:8000"
    env_file:
      - .env
    environment:
      # Never write .pyc to the bind-mounted source tree; keeps it clean and
      # owned by the developer.
      - PYTHONDONTWRITEBYTECODE=1
    extra_hosts:
      # Lets the container reach the host's local LLM at host.docker.internal.
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount source for fast iteration; data for host-visible recording.
      - ./source:/app
      - ./data:/data
    restart: unless-stopped

  # Test image + suite: the same environment CI runs (Option 3, docker all the
  # way). Gated behind the `dev` profile so `docker compose up` (which starts
  # `gateway`) never also runs the test suite. Run with `./scripts/test.sh`, or:
  #
  #     docker compose -f docker-compose.dev.yml run --rm test pytest
  test:
    build:
      context: .
      target: test
    profiles: ["dev"]
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      # Mount source and tests for fast iteration; the image's pyproject.toml
      # keeps `pythonpath = ["source"]` resolving correctly. .env.example and
      # docs/ are mounted for the config-drift test (tests/test_config.py).
      - ./source:/app/source
      - ./tests:/app/tests
      - ./.env.example:/app/.env.example
      - ./docs:/app/docs
    command: pytest
