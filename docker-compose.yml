services:
  gateway:
    build:
      context: .
    ports:
      - "${PORT:-9317}:8000"
    env_file:
      - .env
    extra_hosts:
      # Lets the container reach the host's local LLM at host.docker.internal.
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount source for fast iteration; data for host-visible recording.
      - ./source:/app
      - ./data:/data
    restart: unless-stopped
