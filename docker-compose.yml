# Run llm-gauze from the published GHCR image — the path a public user follows.
#
# This is the "consume" compose file: it pulls the published image (no build, no
# source mount). Point `LLM_BASE_URL` in `.env` at your local LLM, then:
#
#     docker compose up
#
# To pin a specific release instead of `latest`, override the image tag, e.g.
# `ghcr.io/ggeorgovassilis/llm-gauze:7`.
#
# For local development (build from source + live code mount), use
# `docker-compose.dev.yml` via `./scripts/dev.sh`.

services:
  gateway:
    image: ghcr.io/ggeorgovassilis/llm-gauze:latest
    # Run as the host user (UID/GID, default 1000) so the bind-mounted data/
    # directory stays writable and owned by you, not root.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${PORT:-9317}:8000"
    env_file:
      - .env
    extra_hosts:
      # Lets the container reach the host's local LLM at host.docker.internal.
      - "host.docker.internal:host-gateway"
    volumes:
      # Host-visible recording directory.
      - ./data:/data
    restart: unless-stopped
