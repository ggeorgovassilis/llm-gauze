[tool.pytest.ini_options]
# Collect tests from tests/ and make the `app` package (under source/) importable.
# `pythonpath` resolves relative to the repo root locally, and relative to /app in
# the test image (where source/ is copied as a directory), so the same config
# works in both environments.
testpaths = ["tests"]
pythonpath = ["source"]
addopts = "-q --cov=app --cov-report=term-missing"

[tool.ruff]
# Lint + format + import sorting in one tool (ruff subsumes isort/black).
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Default pyflakes + pycodestyle rules, plus import sorting (I).
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
# Pragmatic: type-check the application without requiring full strictness.
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.coverage.run]
# Measure the application under test, never the test files themselves.
source = ["app"]

[tool.coverage.report]
# Fail the suite below this line-coverage floor (see test audit, #39).
# Measured 89% when the floor was introduced; keep headroom for small,
# coverage-neutral refactors while still catching real regressions.
fail_under = 85
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
